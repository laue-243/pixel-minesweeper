<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Minesweeper</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #555; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="320" height="320"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const size = 10;
const cell = 32;
let board = [];
let revealed = [];
let flags = [];
let mines = 15;
let gameOver = false;
let won = false;

function init() {
  board = Array(size).fill().map(() => Array(size).fill(0));
  revealed = Array(size).fill().map(() => Array(size).fill(false));
  flags = Array(size).fill().map(() => Array(size).fill(false));
  // Place mines
  let placed = 0;
  while (placed < mines) {
    const x = Math.floor(Math.random()*size);
    const y = Math.floor(Math.random()*size);
    if (board[y][x] !== -1) {
      board[y][x] = -1;
      placed++;
    }
  }
  // Numbers
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (board[y][x] === -1) continue;
      let count = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const ny = y+dy, nx = x+dx;
          if (ny>=0 && ny<size && nx>=0 && nx<size && board[ny][nx] === -1) count++;
        }
      }
      board[y][x] = count;
    }
  }
}

function draw() {
  ctx.fillStyle = '#222';
  ctx.fillRect(0,0,320,320);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const px = x*cell, py = y*cell;
      if (revealed[y][x]) {
        ctx.fillStyle = '#555';
        ctx.fillRect(px, py, cell-1, cell-1);
        if (board[y][x] === -1) {
          ctx.fillStyle = '#f00';
          ctx.fillRect(px+8, py+8, 16, 16);
        } else if (board[y][x] > 0) {
          ctx.fillStyle = '#0ff';
          ctx.font = '16px monospace';
          ctx.fillText(board[y][x], px+10, py+22);
        }
      } else {
        ctx.fillStyle = '#888';
        ctx.fillRect(px, py, cell-1, cell-1);
        if (flags[y][x]) {
          ctx.fillStyle = '#f00';
          ctx.fillRect(px+10, py+8, 12, 16);
        }
      }
    }
  }
  if (gameOver || won) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,320,320);
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(won ? 'You Win!' : 'Game Over', 160, 160);
  }
}

function reveal(x, y) {
  if (x<0 || x>=size || y<0 || y>=size || revealed[y][x] || flags[y][x]) return;
  revealed[y][x] = true;
  if (board[y][x] === -1) {
    gameOver = true;
    // Reveal all mines
    for (let yy=0; yy<size; yy++) for (let xx=0; xx<size; xx++) if (board[yy][xx]===-1) revealed[yy][xx]=true;
  } else if (board[y][x] === 0) {
    for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) reveal(x+dx, y+dy);
  }
  checkWin();
}

function checkWin() {
  let safe = 0;
  for (let y=0; y<size; y++) for (let x=0; x<size; x++) if (board[y][x] !== -1 && revealed[y][x]) safe++;
  if (safe === size*size - mines) won = true;
}

canvas.addEventListener('click', e => {
  if (gameOver || won) { init(); gameOver=false; won=false; draw(); return; }
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / cell);
  const y = Math.floor((e.clientY - rect.top) / cell);
  reveal(x, y);
  draw();
});

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (gameOver || won) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / cell);
  const y = Math.floor((e.clientY - rect.top) / cell);
  if (!revealed[y][x]) flags[y][x] = !flags[y][x];
  draw();
});

init();
draw();
</script>
</body>
</html>
